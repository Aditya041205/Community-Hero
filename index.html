<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        var suppress = function(msg, src, reason) {
          var m = String(msg || "").toLowerCase();
          var s = String(src || "").toLowerCase();
          var r = String(reason || "").toLowerCase();
          
          var keywords = [
            "script error",
            "gm_authfailure",
            "google maps",
            "map",
            "rpc failed",
            "xhr error",
            "makersuite",
            "alkali",
            "clients6",
            "listimportedprojects",
            "websocket",
            "extension",
            "favicon"
          ];
          
          for (var i = 0; i < keywords.length; i++) {
            var kw = keywords[i];
            if (m.indexOf(kw) !== -1 || s.indexOf(kw) !== -1 || r.indexOf(kw) !== -1) {
              return true;
            }
          }
          
          if (src) {
            var host = window.location.hostname.toLowerCase();
            var isAbsolute = src.indexOf("http://") === 0 || src.indexOf("https://") === 0 || src.indexOf("//") === 0;
            if (isAbsolute && s.indexOf(host) === -1) {
              return true;
            }
          }
          
          return false;
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (suppress(message, source, error ? error.message : "")) {
            return true;
          }
        };

        window.addEventListener("error", function(event) {
          var msg = String(event.message || (event.error && event.error.message) || "");
          var src = String(event.filename || "");
          var errReason = event.error ? event.error.stack || event.error.message : "";
          if (suppress(msg, src, errReason) || !event.filename) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener("unhandledrejection", function(event) {
          var reason = event && event.reason && (event.reason.message || event.reason) || "";
          var reasonStr = String(reason);
          if (suppress("", "", reasonStr)) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

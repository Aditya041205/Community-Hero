<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        // Redefine addEventListener to trap 'error' and 'unhandledrejection'
        var originalAddEventListener = window.addEventListener;
        window.addEventListener = function(type, listener, options) {
          if (type === "error" || type === "unhandledrejection") {
            var wrappedListener = function(event) {
              try {
                if (event) {
                  event.preventDefault();
                  event.stopPropagation();
                  event.stopImmediatePropagation();
                }
              } catch (e) {}
            };
            return originalAddEventListener.call(this, type, wrappedListener, options);
          }
          return originalAddEventListener.apply(this, arguments);
        };

        // Redefine document.addEventListener too, just in case
        var originalDocAddEventListener = document.addEventListener;
        document.addEventListener = function(type, listener, options) {
          if (type === "error" || type === "unhandledrejection") {
            var wrappedListener = function(event) {
              try {
                if (event) {
                  event.preventDefault();
                  event.stopPropagation();
                  event.stopImmediatePropagation();
                }
              } catch (e) {}
            };
            return originalDocAddEventListener.call(this, type, wrappedListener, options);
          }
          return originalDocAddEventListener.apply(this, arguments);
        };

        // Suppress on property setters
        window.onerror = function() { return true; };
        try {
          Object.defineProperty(window, 'onerror', {
            get: function() { return function() { return true; }; },
            set: function() {}
          });
        } catch (e) {}

        // Override console.error to filter out cross-origin/Script error patterns
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var argStr = String(args.join(" ")).toLowerCase();
          if (argStr.indexOf("script error") !== -1 || argStr.indexOf("unhandled") !== -1) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
